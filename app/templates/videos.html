{% extends "base.html" %}

{% block title %}Videos - YouTube Crawler{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Videos</h1>
            <button class="btn btn-primary" onclick="exportVideos()">
                <i class="bi bi-download"></i> Export
            </button>
        </div>
    </div>
</div>

<!-- Search and Filters -->
<div class="row mb-4">
    <div class="col-md-2">
        <input type="text" class="form-control" id="searchQuery" placeholder="Search videos...">
    </div>
    <div class="col-md-2">
        <select class="form-select" id="channelFilter">
            <option value="">All Channels</option>
            <!-- Populated dynamically -->
        </select>
    </div>
    <div class="col-md-2">
        <select class="form-select" id="summaryFilter">
            <option value="">All Videos</option>
            <option value="true">With Summary</option>
            <option value="false">Without Summary</option>
        </select>
    </div>
    <div class="col-md-2">
        <select class="form-select" id="sortFilter" title="Sort videos">
            <option value="fetched" selected>Sort: Fetch time</option>
            <option value="published">Sort: Upload time</option>
        </select>
    </div>
    <div class="col-md-1">
        <select class="form-select" id="orderFilter" title="Sort direction">
            <option value="desc" selected>Desc</option>
            <option value="asc">Asc</option>
        </select>
    </div>
    <div class="col-md-1">
        <select class="form-select" id="browseRowSize" title="Videos per row (browse view)" style="display:none;">
            <option value="3">3 / row</option>
            <option value="4">4 / row</option>
            <option value="5" selected>5 / row</option>
            <option value="6">6 / row</option>
        </select>
    </div>
    <div class="col-md-2">
        <div class="btn-group w-100" role="group" id="viewToggle">
            <button type="button" class="btn btn-outline-secondary active" id="viewListBtn" onclick="setViewMode('list')" title="Detailed list view">
                <i class="bi bi-list-ul"></i> List
            </button>
            <button type="button" class="btn btn-outline-secondary" id="viewBrowseBtn" onclick="setViewMode('browse')" title="Browse view: thumbnail, title and short info, grouped by channel">
                <i class="bi bi-grid"></i> Browse
            </button>
        </div>
    </div>
    <div class="col-md-1">
        <button class="btn btn-primary w-100" onclick="searchVideos()" title="Search / Refresh">
            <i class="bi bi-search"></i>
        </button>
    </div>
</div>

<!-- Videos List -->
<div class="row">
    <div class="col-12">
        <div id="videosList">
            <p class="text-muted">Loading videos...</p>
        </div>
    </div>
</div>

<!-- Pagination -->
<div class="row">
    <div class="col-12">
        <nav>
            <ul class="pagination justify-content-center" id="pagination">
                <!-- Populated dynamically -->
            </ul>
        </nav>
    </div>
</div>

<!-- Video Details Modal -->
<div class="modal fade" id="videoDetailsModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="videoDetailsTitle">Video Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="videoDetailsContent">
                    <p class="text-muted">Loading...</p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="/static/js/videos.js?v=6"></script>
{% endblock %}
