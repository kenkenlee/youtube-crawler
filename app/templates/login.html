{% extends "base.html" %}

{% block title %}Admin Login - YouTube Crawler{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm mt-5">
            <div class="card-header">
                <h5 class="mb-0"><i class="bi bi-shield-lock"></i> Admin Login</h5>
            </div>
            <div class="card-body">
                <p class="text-muted small">The Settings area is password-protected. Enter the admin password to continue.</p>

                {% if error %}
                <div class="alert alert-danger py-2"><i class="bi bi-exclamation-triangle"></i> {{ error }}</div>
                {% endif %}

                <form method="post" action="/settings/login">
                    <div class="mb-3">
                        <label class="form-label" for="password">Admin Password</label>
                        <input type="password" class="form-control" id="password" name="password" autofocus required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
