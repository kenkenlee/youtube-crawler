name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy pylint
        pip install -r requirements.txt

    - name: Run Black formatter check
      run: |
        black --check --diff app
      continue-on-error: true

    - name: Run isort import check
      run: |
        isort --check-only --diff app
      continue-on-error: true

    - name: Run flake8
      run: |
        flake8 app --count --statistics --max-line-length=127
      continue-on-error: true

    - name: Run pylint
      run: |
        pylint app --exit-zero --max-line-length=127
      continue-on-error: true

    - name: Run mypy type checking
      run: |
        mypy app --ignore-missing-imports
      continue-on-error: true

    - name: Generate code quality report
      run: |
        echo "## Code Quality Report" > code-quality-report.md
        echo "" >> code-quality-report.md
        echo "### Black Formatting" >> code-quality-report.md
        black --check app 2>&1 | tee -a code-quality-report.md || true
        echo "" >> code-quality-report.md
        echo "### Flake8 Linting" >> code-quality-report.md
        flake8 app --statistics 2>&1 | tee -a code-quality-report.md || true
      continue-on-error: true

    - name: Upload quality report
      uses: actions/upload-artifact@v3
      with:
        name: code-quality-report
        path: code-quality-report.md
      continue-on-error: true
